models:
  - name: stg_jaffle_shop__customers
    description: "One unique customer per row."
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null
        description: "Primary key for each customer."
      - name: first_name
        description: "Customer's first name."
      - name: last_name
        description: "Customer's last name."

  - name: stg_jaffle_shop__orders
    description: "Staging models for the jaffle_shop source data."
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
        description: "Primary key for each order."
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_jaffle_shop__customers')
                field: customer_id
        description: "Unique identifier linking to the customer who placed the order. Primary key for each customer"
      - name: order_date
        description: "Date when the order was placed."
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['placed', 'shipped', 'completed', 'returned', 'return_pending']
        description: '{{ doc("order_status") }}'