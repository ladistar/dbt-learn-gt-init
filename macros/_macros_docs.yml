version: 2

macros:
  - name: cents_to_dollars
    description: "Converts a monetary value from cents to dollars by dividing by 100 and rounding to specified decimal places"
    arguments:
      - name: column_name
        type: string
        description: "The column or value in cents to convert to dollars"
      - name: decimal
        type: integer
        description: "Number of decimal places to round the result to"
        default: 2
    example:
      - description: "Convert the 'amount' column from cents to dollars, rounded to 2 decimal places"
        code: "{{ cents_to_dollars('amount', 2) }}"

  - name: grant_select
    description: "Grants SELECT permissions on all tables and views in a schema to a specified role"
    arguments:
      - name: schema
        type: string
        description: "The schema to grant permissions on"
        default: "target.schema"
      - name: role
        type: string
        description: "The role to grant permissions to"
        default: "target.role"
      - name: database
        type: string
    examples:
      - description: "Grant SELECT permissions on all tables and views in the 'analytics' schema to the 'data_analyst' role in the 'production' database"
        code: "{{ grant_select(schema='analytics', role='data_analyst', database='production') }}"

  - name: clean_stale_models
    description: "Queries the information schema to find tables and views older than specified days and generates automated drop statements with optional execution"
    arguments:
      - name: database
        type: string
        description: "The database to query for stale models"
        default: "target.database"
      - name: schema
        type: string
        description: "The schema to search for stale models"
        default: "target.schema"
      - name: days
        type: integer
        description: "Number of days to consider a model stale (objects older than this will be targeted for cleanup)"
        default: 7
      - name: dry_run
        type: boolean
        description: "When True (default and safer), only logs the drop statements without executing them. When False, executes the drop statements. Use True to preview changes before making modifications."
        default: True
    examples:
      - description: "Preview drop statements for models older than 7 days in the current schema"
        code: "{{ clean_stale_models() }}"
      - description: "Execute cleanup of models older than 14 days in the 'staging' schema"
        code: "{{ clean_stale_models(schema='staging', days=14, dry_run=False) }}"


  - name: union_tables_by_prefix
    description: "Unions all tables with a specified prefix from a given database and schema"
    arguments:
      - name: database
        type: string
        description: "The database containing the tables to union"
      - name: schema
        type: string
        description: "The schema containing the tables to union"
      - name: prefix
        type: string
        description: "The prefix to match table names against"
    examples:
      - description: "Union all tables starting with 'staging_' in the 'raw' schema"
        code: "{{ union_tables_by_prefix('my_database', 'raw', 'staging_') }}"

  - name: generate_schema_name
    description: "Generates a schema name by appending a custom schema suffix to the default target schema, or returns the default schema if no custom name is provided"
    arguments:
      - name: custom_schema_name
        type: string
        description: "The custom schema suffix to append to the default schema. If null or empty, only the default schema is used"
      - name: node
        type: object
        description: "The dbt node object (typically not used in the logic but required by dbt's schema naming convention)"
    examples:
      - description: "Generate schema name with custom suffix 'staging'"
        code: "{{ generate_schema_name('staging', this) }}"
      - description: "Generate schema name with no custom suffix (returns default schema)"
        code: "{{ generate_schema_name(none, this) }}"